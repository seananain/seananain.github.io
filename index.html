<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>teej</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eaefee;
  --fg:#101615;
  --muted:#56635f;
  --line:#c3cfcb;
  --accent:#0d8466;
  --dot:#97a8a3;
  --panel:#ffffffd9;
  --frame:#0b0f0e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080b0b;--fg:#e8f0ee;--muted:#80918c;--line:#1f2a28;--accent:#5fe0b6;--dot:#2c3a37;--panel:#101716e6;--frame:#000;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080b0b;--fg:#e8f0ee;--muted:#80918c;--line:#1f2a28;--accent:#5fe0b6;--dot:#2c3a37;--panel:#101716e6;--frame:#000;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow-x:hidden}
#field{position:fixed;inset:0;width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1;min-height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:24px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:24px;
  pointer-events:none}
.wrap a,.wrap button,.photo{pointer-events:auto}
.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:10px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}

.stage{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:end;gap:0;min-width:0}
.hero{display:grid;gap:18px;padding-bottom:4vh;min-width:0;position:relative;z-index:1}
h1{margin:0 -0.06em 0 0;font-weight:800;font-size:clamp(96px,22vw,340px);line-height:.82;letter-spacing:-.055em;
  font-variation-settings:"opsz" 96;color:var(--fg);white-space:nowrap}
figure{position:relative;z-index:2}
h1 .ch{display:inline-block;transform:translateY(.25em);opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
h1 .ch:nth-child(2){animation-delay:.07s}h1 .ch:nth-child(3){animation-delay:.14s}h1 .ch:nth-child(4){animation-delay:.21s}
@keyframes rise{to{transform:none;opacity:1}}
.dotmark{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--accent);margin-left:.04em;vertical-align:baseline}
.sub{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;font-size:clamp(18px,2.4vw,26px)}
.caret{display:inline-block;width:.55em;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.links{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 var(--mono);color:var(--fg);text-decoration:none;
  border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);padding:11px 14px;border-radius:999px;cursor:pointer;
  transition:border-color .2s,transform .2s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:focus-visible,.photo:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn svg{width:15px;height:15px;fill:currentColor}
kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg)}

figure{margin:0;display:grid;gap:10px;justify-items:end}
.photo{--mx:50%;--my:42%;--lit:0;position:relative;height:min(76vh,720px);aspect-ratio:628/822;max-width:100%;
  background:var(--frame);overflow:hidden;cursor:crosshair;transform:perspective(900px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));
  transition:transform .25s ease-out;box-shadow:0 40px 80px -30px #000a, 0 0 0 1px var(--line);
  clip-path:inset(0 0 0 0);animation:reveal 1.1s .15s cubic-bezier(.7,0,.2,1) both}
@keyframes reveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.photo .base{filter:contrast(1.05) saturate(.85)}
.photo .lit{filter:brightness(1.9) contrast(1.08) saturate(1.15);opacity:var(--lit);transition:opacity .3s;
  -webkit-mask-image:radial-gradient(circle 150px at var(--mx) var(--my),#000 0,#000 30%,transparent 72%);
          mask-image:radial-gradient(circle 150px at var(--mx) var(--my),#000 0,#000 30%,transparent 72%)}
.photo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.tagline{position:absolute;left:12px;top:12px;font:500 10px/1 var(--mono);letter-spacing:.08em;color:#cfe;opacity:.7;text-transform:uppercase;z-index:1}
.lux{position:absolute;right:12px;bottom:12px;z-index:1;font:500 10px/1 var(--mono);letter-spacing:.06em;color:#bfe9da;
  background:#0009;padding:6px 8px;border-radius:4px;font-variant-numeric:tabular-nums}
figcaption{font:12px var(--mono);color:var(--muted);letter-spacing:.03em}
figcaption b{color:var(--accent);font-weight:500}

.term{position:fixed;z-index:5;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));
  width:min(440px,calc(100vw - 32px));background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;
  font:13px/1.55 var(--mono);box-shadow:0 30px 60px -20px #0006;overflow:hidden}
.term header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;letter-spacing:.06em}
.term header button{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:2px 4px}
.term header button:hover{color:var(--fg)}
#out{max-height:240px;overflow-y:auto;padding:12px 14px 0;white-space:pre-wrap;word-break:break-word}
#out .cmd{color:var(--muted)}
#out .acc{color:var(--accent)}
#out a{color:var(--accent)}
.prompt{display:flex;gap:8px;padding:8px 14px 14px}
.prompt span{color:var(--accent)}
#cmd{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit}

@media (max-width:820px){
  .stage{grid-template-columns:1fr;justify-content:stretch;gap:20px;align-items:start}
  figure{order:-1;justify-items:center}
  .photo{height:auto;width:min(100%,380px)}
  h1{margin:0;font-size:clamp(84px,28vw,160px)}
  .hero{padding-bottom:0}
  .top .hide-sm,.bottom .hide-sm{display:none}
  .term{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){h1 .ch{animation:none;opacity:1;transform:none}.pulse,.caret,.photo{animation:none}.photo{transition:none}}
</style>

<canvas id="field" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="top">
    <span class="status"><span class="pulse"></span>building something</span>
    <span class="hide-sm">local time <span id="clock">--:--:--</span></span>
  </div>

  <div class="stage">
    <main class="hero">
      <h1 aria-label="teej"><span class="ch">t</span><span class="ch">e</span><span class="ch">e</span><span class="ch">j</span></h1>
      <div class="sub"><span id="tag">Coming soon</span><span class="caret" aria-hidden="true"></span></div>
      <div class="links">
        <a class="btn" id="li" href="https://www.linkedin.com/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.6 8.65 21 11.2 21 14.5V21h-4v-5.8c0-1.4-.03-3.2-1.95-3.2-1.95 0-2.25 1.52-2.25 3.1V21H9z"/></svg>
          LinkedIn
        </a>
        <button class="btn" id="openTerm" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v12h16V6zm2.3 2.3L10 12l-3.7 3.7-1.4-1.4L7.2 12 4.9 9.7zM11 15h6v2h-6z"/></svg>
          terminal <kbd>/</kbd>
        </button>
      </div>
    </main>

    <figure>
      <div class="photo" id="photo" tabindex="0" aria-label="Photo of teej. Move your cursor or finger over it to light it up.">
        <img class="base" src="teej.jpg" alt="teej, close-up selfie in low light with glasses" width="628" height="822">
        <img class="lit" src="teej.jpg" alt="" aria-hidden="true">
        <span class="tagline">teej / after hours</span>
        <span class="lux" id="lux">light 000%</span>
      </div>
      <figcaption>hover to bring a <b>flashlight</b></figcaption>
    </figure>
  </div>

  <div class="bottom">
    <span>© <span id="yr"></span> teej</span>
    <span class="hide-sm">click anywhere for a ripple</span>
  </div>
</div>

<section class="term" id="term" hidden aria-label="Terminal">
  <header><span>teej@site ~</span><button type="button" id="closeTerm" aria-label="Close terminal">esc ✕</button></header>
  <div id="out"></div>
  <form class="prompt" id="form" autocomplete="off"><span>→</span><input id="cmd" aria-label="Command" spellcheck="false"></form>
</section>

<script>
const LINKEDIN = "https://www.linkedin.com/";
document.getElementById("li").href = LINKEDIN;
document.getElementById("yr").textContent = new Date().getFullYear();

const clock = document.getElementById("clock");
const tick = () => clock.textContent = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
tick(); setInterval(tick, 1000);

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const lines = ["Coming soon", "New site in progress", "Check back shortly", "Say hi on LinkedIn"];
const tag = document.getElementById("tag");
if (!reduce) {
  let li = 0, ci = lines[0].length, del = true;
  setTimeout(function loop() {
    const s = lines[li];
    if (del) { ci--; if (ci === 0) { del = false; li = (li + 1) % lines.length; } }
    else { ci++; if (ci === lines[li].length) { del = true; tag.textContent = lines[li]; return setTimeout(loop, 2600); } }
    tag.textContent = (del ? s : lines[li]).slice(0, ci);
    setTimeout(loop, del ? 35 : 70);
  }, 2600);
}

const photo = document.getElementById("photo"), lux = document.getElementById("lux");
let litTarget = 0, lit = 0, luxTimer;
function aim(e){
  const r = photo.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  photo.style.setProperty("--mx", x + "px"); photo.style.setProperty("--my", y + "px");
  if (!reduce) { photo.style.setProperty("--ry", ((x / r.width - .5) * 8).toFixed(2) + "deg"); photo.style.setProperty("--rx", ((.5 - y / r.height) * 8).toFixed(2) + "deg"); }
  const face = 1 - Math.min(1, Math.hypot(x / r.width - .52, y / r.height - .5) * 2.2);
  litTarget = Math.round(55 + face * 45);
}
function on(e){ photo.style.setProperty("--lit", 1); aim(e); }
function off(){ photo.style.setProperty("--lit", 0); photo.style.setProperty("--rx","0deg"); photo.style.setProperty("--ry","0deg"); litTarget = 0; }
photo.addEventListener("pointerenter", on);
photo.addEventListener("pointermove", aim);
photo.addEventListener("pointerdown", on);
photo.addEventListener("pointerleave", off);
photo.addEventListener("pointercancel", off);
photo.addEventListener("focus", () => { photo.style.setProperty("--mx","52%"); photo.style.setProperty("--my","48%"); photo.style.setProperty("--lit",1); litTarget = 100; });
photo.addEventListener("blur", off);
(function luxLoop(){ lit += (litTarget - lit) * .15; lux.textContent = "light " + String(Math.round(lit)).padStart(3,"0") + "%"; requestAnimationFrame(luxLoop); })();

const cv = document.getElementById("field"), ctx = cv.getContext("2d");
let W, H, dpr, pts = [], mouse = {x: -9999, y: -9999}, ripples = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let cDot, cAcc;
function readColors(){ cDot = css("--dot"); cAcc = css("--accent"); }
function build(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const gap = W < 560 ? 22 : 28; pts = [];
  for (let y = gap/2; y < H; y += gap) for (let x = gap/2; x < W; x += gap) pts.push({ox:x, oy:y, x, y});
  readColors();
}
addEventListener("resize", build);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
addEventListener("pointerdown", e => { if (!e.target.closest("a,button,input,.term")) ripples.push({x:e.clientX, y:e.clientY, r:0}); });
build();

function frame(){
  ctx.clearRect(0,0,W,H);
  const R = 140, M = Math.max(W,H);
  ripples.forEach(r => r.r += 9); ripples = ripples.filter(r => r.r < M);
  for (const p of pts) {
    let dx = p.ox - mouse.x, dy = p.oy - mouse.y, d = Math.hypot(dx,dy), push = 0, glow = 0;
    if (d < R) { push = (1 - d/R) * 18; glow = 1 - d/R; }
    for (const r of ripples) { const rd = Math.hypot(p.ox - r.x, p.oy - r.y), band = Math.abs(rd - r.r); if (band < 30) { const k = (1 - band/30) * (1 - r.r/M); glow = Math.max(glow, k); push += k * 10; dx = p.ox - r.x; dy = p.oy - r.y; d = rd; } }
    const tx = p.ox + (d ? dx/d : 0) * push, ty = p.oy + (d ? dy/d : 0) * push;
    p.x += (tx - p.x) * .18; p.y += (ty - p.y) * .18;
    ctx.globalAlpha = .55 + glow * .45;
    ctx.fillStyle = glow > .08 ? cAcc : cDot;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.1 + glow * 1.8, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
frame();

const term = document.getElementById("term"), out = document.getElementById("out"), input = document.getElementById("cmd");
const hist = []; let hi = 0, greeted = false;
function print(html, cls){ const d = document.createElement("div"); if (cls) d.className = cls; d.innerHTML = html; out.appendChild(d); out.scrollTop = out.scrollHeight; }
const cmds = {
  help: () => print("commands: <span class='acc'>whoami</span>, <span class='acc'>links</span>, <span class='acc'>status</span>, <span class='acc'>flash</span>, <span class='acc'>time</span>, <span class='acc'>theme</span>, <span class='acc'>clear</span>, <span class='acc'>exit</span>"),
  whoami: () => print("teej. usually found up late, lit by a screen. the full site is on the way."),
  links: () => print(`linkedin  → <a href="${LINKEDIN}" target="_blank" rel="noopener">${LINKEDIN.replace(/^https?:\/\//,"")}</a>`),
  linkedin: () => cmds.links(),
  status: () => print("build: <span class='acc'>in progress</span>\nETA: soon™"),
  flash: () => {
    if (reduce) { photo.style.setProperty("--lit",1); litTarget = 100; setTimeout(off, 1500); return print("lights on."); }
    let t = 0; photo.style.setProperty("--lit",1); litTarget = 100;
    (function sweep(){ t += .02; const r = photo.getBoundingClientRect();
      photo.style.setProperty("--mx", (50 + Math.cos(t*4) * 35) + "%"); photo.style.setProperty("--my", (50 + Math.sin(t*6) * 30) + "%");
      t < 1.6 ? requestAnimationFrame(sweep) : off(); })();
    print("sweeping the flashlight...");
  },
  time: () => print(new Date().toString()),
  date: () => cmds.time(),
  theme: () => {
    const r = document.documentElement, cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark"; r.setAttribute("data-theme", next); print("theme → " + next);
  },
  clear: () => { out.innerHTML = ""; },
  exit: () => closeTerm(),
  sudo: () => print("nice try."),
  ls: () => print("teej.jpg  about.txt  projects/  (most of it coming soon)"),
};
function run(raw){
  const c = raw.trim(); if (!c) return;
  print("→ " + c.replace(/</g,"&lt;"), "cmd");
  hist.push(c); hi = hist.length;
  const f = cmds[c.toLowerCase().split(/\s+/)[0]];
  f ? f() : print(`command not found: ${c.replace(/</g,"&lt;")}. try <span class='acc'>help</span>`);
}
function openTerm(){ term.hidden = false; if (!greeted) { print("welcome. type <span class='acc'>help</span> to look around."); greeted = true; } input.focus(); }
function closeTerm(){ term.hidden = true; document.getElementById("openTerm").focus(); }
document.getElementById("openTerm").onclick = () => term.hidden ? openTerm() : closeTerm();
document.getElementById("closeTerm").onclick = closeTerm;
document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); run(input.value); input.value = ""; });
input.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && hi > 0) { hi--; input.value = hist[hi]; e.preventDefault(); }
  if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ""; e.preventDefault(); }
  if (e.key === "Tab") { e.preventDefault(); const m = Object.keys(cmds).filter(k => k.startsWith(input.value.toLowerCase())); if (m.length === 1) input.value = m[0]; else if (m.length) print(m.join("  ")); }
});
addEventListener("keydown", e => {
  if (e.key === "/" && term.hidden && document.activeElement.tagName !== "INPUT") { e.preventDefault(); openTerm(); }
  if (e.key === "Escape" && !term.hidden) closeTerm();
});
</script>

</body></html>
